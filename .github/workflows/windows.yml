name: Build Windows desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-build.txt
      - name: Test sources and packaged EXE, capture GUI, and create release ZIPs
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: ./scripts/build-windows.ps1
      - name: Upload Windows app and corresponding source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ScanPDF-Windows
          path: |
            desktop/dist/ScanPDF-Desktop-Windows-x64.zip
            desktop/dist/ScanPDF-Desktop-Windows-x64.zip.sha256
            desktop/dist/ScanPDF-Desktop-Source.zip
            desktop/dist/ScanPDF-Desktop-Source.zip.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Upload desktop GUI preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ScanPDF-Desktop-Preview
          path: desktop/dist/ScanPDF-Desktop-Preview.png
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish downloadable Windows app
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: scanpdf-releases
      cancel-in-progress: false
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download tested Windows app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ScanPDF-Windows
          path: dist
      - name: Publish app and source without replacing iOS assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/publish-release.sh \
            dist/ScanPDF-Desktop-Windows-x64.zip \
            dist/ScanPDF-Desktop-Source.zip
