name: ScanPDF
options:
  bundleIdPrefix: com.duckk37
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.40.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_LANGUAGE: vi
targets:
  ScanPDF:
    type: application
    platform: iOS
    sources:
      - path: ScanPDF
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duckk37.scanpdf
        PRODUCT_NAME: ScanPDF
        INFOPLIST_FILE: ScanPDF/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: PDFKit.framework
      - sdk: Vision.framework
      - sdk: VisionKit.framework
      - sdk: PhotosUI.framework
  ScanPDFTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScanPDFTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duckk37.scanpdf.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScanPDF
schemes:
  ScanPDF:
    build:
      targets:
        ScanPDF: all
        ScanPDFTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ScanPDFTests
    archive:
      config: Release
